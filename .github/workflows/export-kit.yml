      - uses: ./.github/actions/parity-setup
        with:
          skip-unit-tests: 'true'
          artifact-suffix: windows-programs-3of6
      - name: Programs gate shard 3/6
        run: bash scripts/gate-step.sh parity/out/programs.log node parity/sweep-programs.mjs --shard 3/6
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rendered-parity-windows-programs-3of6-${{ github.sha }}
          path: parity/out/
          if-no-files-found: error

  parity-windows-programs-4of6:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ./.github/actions/parity-setup
