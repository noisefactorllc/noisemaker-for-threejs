    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ./.github/actions/parity-setup
        with:
          skip-unit-tests: 'true'
          artifact-suffix: consumer-${{ matrix.os }}
      - name: Installed consumer gate
        run: |
          tarball=$(npm pack --pack-destination "$RUNNER_TEMP")
          consumer="$RUNNER_TEMP/threejs-consumer"
          mkdir -p "$consumer"
          npm install --prefix "$consumer" --no-audit --no-fund --bin-links=false "$RUNNER_TEMP/$tarball" three@0.186.1
          bash "$consumer/node_modules/noisemaker-for-threejs/vendor/fetch.sh"
          node parity/installed-consumer.mjs "$consumer" parity/out/installed-consumer 0.186.1
          npm uninstall --prefix "$consumer" --no-audit --no-fund --bin-links=false noisemaker-for-threejs
          test ! -d "$consumer/node_modules/noisemaker-for-threejs"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rendered-parity-consumer-${{ matrix.os }}-${{ github.sha }}
          path: parity/out/
          if-no-files-found: error

  # Real Safari, not Playwright's WebKit build, through safaridriver
  # (NM_BROWSER=safari, parity/safari-webdriver.mjs). A hosted macOS runner has
  # passwordless sudo, so it can enable Safari automation; a self-hosted Mac asks
  # for an admin password at the same step. One sweep case renders golden and
  # candidate in Safari at tolerance 0. The job fails unless the case is exact
  # and both modes record zero console errors and zero page errors.
  parity-safari:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ./.github/actions/parity-setup
        with:
          skip-unit-tests: 'true'
          artifact-suffix: safari
      - name: Enable Safari WebDriver on this ephemeral runner
        run: |
          { sw_vers; /usr/bin/safaridriver --version; } | tee parity/out/safari-identity.log
          sudo /usr/bin/safaridriver --enable
      - name: Safari WebGL2 probe
        env:
          NM_BROWSER: safari
        run: |
          set -o pipefail
          node parity/win-probe.mjs 2>&1 | tee parity/out/safari-probe.log
          grep -F '"webgl2":true' parity/out/safari-probe.log
      - name: Safari sweep case
        env:
          NM_BROWSER: safari
          SUMMARY_LOG: parity/out/safari-summary.log
        run: |
          set -o pipefail
          bash scripts/parity-summary noise 2>&1 | tee "$SUMMARY_LOG"
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs'
          const lines = readFileSync(process.env.SUMMARY_LOG, 'utf8').split('\n')
          const records = (prefix) => lines.filter((l) => l.startsWith(prefix)).map((l) => JSON.parse(l.slice(prefix.length)))
          const summary = records('PARITY-SUMMARY ')
          const consoles = records('PARITY-CONSOLE ')
          if (summary.length !== 1 || summary[0].expected !== 1 || summary[0].executed !== 1 || summary[0].exact !== 1) {
            throw new Error(`Safari summary: ${JSON.stringify(summary)}`)
          }
          const modes = consoles.map((c) => c.mode).sort().join(',')
          if (modes !== 'candidate,golden' || !consoles.every((c) => c.browser === 'safari' && c.errors === 0 && c.pageErrors === 0)) {
            throw new Error(`Safari console record: ${JSON.stringify(consoles)}`)
          }
          console.log(`Safari ${consoles[0].version}: ${JSON.stringify(summary[0])}; console errors 0, page errors 0 in both modes`)
          JS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rendered-parity-safari-${{ github.sha }}
          path: parity/out/
          if-no-files-found: error

  dispatch:
    needs: [parity-windows-programs-verify, parity, parity-windows-programs-0of6, parity-windows-programs-1of6, parity-windows-programs-2of6, parity-windows-programs-3of6, parity-windows-programs-4of6, parity-windows-programs-5of12, parity-windows-programs-11of24, parity-windows-programs-23of48, parity-windows-programs-octaveWarp, parity-windows-programs-47of48-no-octaveWarp, parity-windows-stateful, parity-windows-corpus, parity-windows-consumer, parity-consumer]
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      # The release mints a new kit version for every dispatch, so a weekly run on
      # an unchanged main must not release the same SHA again.
      - name: Skip a SHA that is already released
        id: released
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          tags=$(git ls-remote --tags "https://github.com/$REPO.git" 'refs/tags/kit-*')
          if printf '%s\n' "$tags" | awk '$2 ~ /\^\{\}$/ { print $1 }' | grep -qx "$SHA"; then
            echo "$SHA already carries a kit tag; nothing to release."
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the release dispatch configuration
        if: steps.released.outputs.released == 'false'
        env:
          RELEASE_REPOSITORY: ${{ secrets.RELEASE_REPOSITORY }}
          EXPORT_KIT_RELEASE_WORKFLOW: ${{ secrets.EXPORT_KIT_RELEASE_WORKFLOW }}
        run: |
          missing=""
          [ -n "$RELEASE_REPOSITORY" ] || missing="$missing RELEASE_REPOSITORY"
          [ -n "$EXPORT_KIT_RELEASE_WORKFLOW" ] || missing="$missing EXPORT_KIT_RELEASE_WORKFLOW"
          if [ -n "$missing" ]; then
            echo "::error::The release dispatch is not configured. Empty or unset secret(s):$missing"
            exit 1
          fi

      - name: Mint release-dispatch token
        if: steps.released.outputs.released == 'false'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: 2959521
          private-key: ${{ secrets.EHSRE_APP_PRIVATE_KEY }}
          owner: noisefactorllc
          repositories: ${{ secrets.RELEASE_REPOSITORY }}

      - name: Dispatch the export-kit release
        if: steps.released.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_REPOSITORY: ${{ secrets.RELEASE_REPOSITORY }}
          EXPORT_KIT_RELEASE_WORKFLOW: ${{ secrets.EXPORT_KIT_RELEASE_WORKFLOW }}
        run: |
          gh workflow run "$EXPORT_KIT_RELEASE_WORKFLOW" \
            --repo "$GITHUB_REPOSITORY_OWNER/$RELEASE_REPOSITORY" \
            --ref main \
            -f kit=threejs \
            -f sha=${{ github.sha }}

  parity-windows-served-kit:
    needs: dispatch
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    permissions:
      contents: read
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ./.github/actions/parity-setup
        with:
          skip-unit-tests: 'true'
          artifact-suffix: windows-served-kit
      - name: Wait for exact-source served kit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node --input-type=module - <<'JS'
          const url = 'https://kits.noisedeck.app/threejs/0/kit.json'
          const deadline = Date.now() + 30 * 60 * 1000
          while (Date.now() < deadline) {
            try {
              const response = await fetch(url, { cache: 'no-store' })
              if (response.ok) {
                const kit = await response.json()
                if (kit.source?.sha === process.env.EXPECTED_SHA) process.exit(0)
              }
            } catch { /* The release may still be in progress. */ }
            await new Promise(resolve => setTimeout(resolve, 30000))
          }
          throw new Error('Exact-source served kit did not appear within 30 minutes')
          JS
      - name: Served kit consumer gate
        run: node parity/kit-consumer.mjs parity/out/kit-consumer
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rendered-parity-windows-served-kit-${{ github.sha }}
          path: parity/out/
          if-no-files-found: error

  # The same served-kit consumer gate on Linux (headless SwiftShader) and macOS
  # (ANGLE/Metal), beside the Windows job above.
  parity-served-kit:
    needs: dispatch
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ./.github/actions/parity-setup
        with:
          skip-unit-tests: 'true'
          artifact-suffix: served-kit-${{ matrix.os }}
      - name: Wait for exact-source served kit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node --input-type=module - <<'JS'
          const url = 'https://kits.noisedeck.app/threejs/0/kit.json'
          const deadline = Date.now() + 30 * 60 * 1000
          while (Date.now() < deadline) {
            try {
              const response = await fetch(url, { cache: 'no-store' })
              if (response.ok) {
                const kit = await response.json()
                if (kit.source?.sha === process.env.EXPECTED_SHA) process.exit(0)
              }
            } catch { /* The release may still be in progress. */ }
            await new Promise(resolve => setTimeout(resolve, 30000))
          }
          throw new Error('Exact-source served kit did not appear within 30 minutes')
          JS
      - name: Served kit consumer gate
        run: node parity/kit-consumer.mjs parity/out/kit-consumer
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rendered-parity-served-kit-${{ matrix.os }}-${{ github.sha }}
          path: parity/out/
          if-no-files-found: error
