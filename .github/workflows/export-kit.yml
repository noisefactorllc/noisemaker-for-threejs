    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ./.github/actions/parity-setup
        with:
          skip-unit-tests: 'true'
          artifact-suffix: windows-programs-5of12
      - name: Programs gate shard 5/12
        run: bash scripts/gate-step.sh parity/out/programs.log node parity/sweep-programs.mjs --shard 5/12
