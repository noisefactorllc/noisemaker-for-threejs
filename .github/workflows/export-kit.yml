  parity-windows-programs-5of12:
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    permissions:
      contents: read
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
