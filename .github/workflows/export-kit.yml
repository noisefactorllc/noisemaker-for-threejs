  parity-windows-programs-verify:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    needs: [parity-windows-programs-0of6, parity-windows-programs-1of6, parity-windows-programs-2of6, parity-windows-programs-3of6, parity-windows-programs-4of6, parity-windows-programs-5of12, parity-windows-programs-11of24, parity-windows-programs-23of24]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: rendered-parity-windows-programs-*-${{ github.sha }}
          path: shard-artifacts
      - name: Verify shard ledger coverage
        run: node scripts/verify-shards.mjs shard-artifacts/*/mode-ledger.shard*.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
