      - uses: ./.github/actions/parity-setup
        with:
          skip-unit-tests: 'true'
          artifact-suffix: windows-stateful
      - name: Stateful gate
        run: bash scripts/gate-step.sh parity/out/stateful.log bash parity/sweep-stateful.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
