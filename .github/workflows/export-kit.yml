  parity-windows-programs-verify:
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    permissions:
      contents: read
    needs: [parity-windows-programs-0of6, parity-windows-programs-1of6, parity-windows-programs-2of6, parity-windows-programs-3of6, parity-windows-programs-4of6, parity-windows-programs-5of12, parity-windows-programs-11of24, parity-windows-programs-23of48, parity-windows-programs-octaveWarp, parity-windows-programs-47of48-no-octaveWarp]
