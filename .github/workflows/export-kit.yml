    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: rendered-parity-windows-programs-*-${{ github.sha }}
          path: shard-artifacts
      # current-programs (via scripts/verify-shards.mjs) reads the vendored
      # upstream effects manifest, which is produced by vendor/fetch.sh —
      # vendor/ is not committed (run 36611586678: verify-shards ENOENT).
      - name: Fetch vendor
        run: bash vendor/fetch.sh
      - name: Verify shard ledger coverage
        run: bash scripts/gate-step.sh shard-artifacts/verify.log bash -c 'ls shard-artifacts/; find shard-artifacts -maxdepth 2 -name "mode-ledger*" | sort; node scripts/verify-shards.mjs shard-artifacts/*/mode-ledger*.json'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rendered-parity-windows-programs-verify-${{ github.sha }}
