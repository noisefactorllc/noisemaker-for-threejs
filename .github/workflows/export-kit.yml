      - name: Programs gate shard 23/48
        run: bash scripts/gate-step.sh parity/out/programs.log node parity/sweep-programs.mjs --shard 23/48
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rendered-parity-windows-programs-23of48-${{ github.sha }}
          path: parity/out/
          if-no-files-found: error

  # Earlier Windows runs timed out or lost their runner on octaveWarp. The
  # exact-source ebbea00 run passed this case on windows-2025; keep both
  # watchdogs bounded and require its ledger in the shard union.
  parity-windows-programs-octaveWarp:
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    permissions:
      contents: read
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ./.github/actions/parity-setup
        with:
          skip-unit-tests: 'true'
          artifact-suffix: windows-programs-octaveWarp
      - name: Programs gate octaveWarp
        env:
          NM_CHUNK_TIMEOUT_MS: '3600000'
          NM_TS_TIMEOUT_MS: '3600000'
        run: bash scripts/gate-step.sh parity/out/programs.log node parity/sweep-programs.mjs --filter octaveWarp
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success()
        with:
          name: rendered-parity-windows-programs-octaveWarp-${{ github.sha }}
          path: parity/out/
          if-no-files-found: error

  parity-windows-programs-47of48-no-octaveWarp:
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
