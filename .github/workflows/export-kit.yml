name: Export kit

# Public repo: holds NO deploy credentials. Dispatches scaffold's
# export-kit-release.yml, which builds this repo's export kit at this exact
# SHA and ships it to kits.noisedeck.app. See scaffold
# docs/runbook/export-kits.md.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "export-kit/**"
      - ".github/workflows/export-kit.yml"
      # LICENSE is shipped kit content (vendored into LICENSES/): a relicense must auto-publish.
      - "LICENSE"
      - "src/**"
      - "package-lock.json"

concurrency:
  group: export-kit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  parity:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Install rendered-gate tooling
        run: |
          node node_modules/.bin/playwright install --with-deps chromium-headless-shell
          python3 -m venv parity/.venv
          parity/.venv/bin/pip install -r parity/requirements.txt
      - run: bash vendor/fetch.sh
      - run: npm run lint
      - run: npm test
      - name: Rendered parity — programs sweep
        run: node parity/sweep-programs.mjs
      - name: Rendered parity — stateful sweep
        run: bash parity/sweep-stateful.sh
      - name: Rendered parity — corpus sweep
        run: npm run parity

  dispatch:
    needs: parity
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Mint scaffold-dispatch token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: 2959521
          private-key: ${{ secrets.EHSRE_APP_PRIVATE_KEY }}
          owner: noisefactorllc
          repositories: scaffold

      - name: Dispatch export-kit-release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run export-kit-release.yml \
            --repo noisefactorllc/scaffold \
            --ref main \
            -f kit=threejs \
            -f sha=${{ github.sha }}
