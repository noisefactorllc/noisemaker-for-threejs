name: Export kit

# Public repo: holds NO deploy credentials. Dispatches scaffold's
# export-kit-release.yml, which builds this repo's export kit at this exact
# SHA and ships it to kits.noisedeck.app. See scaffold
# docs/runbook/export-kits.md.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "export-kit/**"
      - ".github/workflows/export-kit.yml"
      # LICENSE is shipped kit content (vendored into LICENSES/): a relicense must auto-publish.
      - "LICENSE"
      - "src/**"
      - "package-lock.json"
      - "package.json"
      - "parity/**"
      - "test/**"
      - "vendor/fetch.sh"
      - ".github/actions/**"

concurrency:
  group: export-kit-${{ github.ref }}
  cancel-in-progress: false

env:
  NM_PARITY_PYTHON: python

jobs:
  # Linux + macOS run the full suite in one job: both are stable hosted
  # runners. macOS measures the byte-exact gates on real ANGLE/Metal.
  parity:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ./.github/actions/parity-setup
        with:
          artifact-suffix: ${{ matrix.os }}
      - name: Programs gate
        run: node parity/sweep-programs.mjs 2>&1 | tee parity/out/programs.log
      - name: Stateful gate
        if: ${{ !cancelled() }}
        run: bash parity/sweep-stateful.sh 2>&1 | tee parity/out/stateful.log
      - name: Corpus gate
        if: ${{ !cancelled() }}
        run: npm run parity 2>&1 | tee parity/out/corpus.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rendered-parity-${{ matrix.os }}-${{ github.sha }}
          path: parity/out/
          if-no-files-found: error

  # Windows: six hosted-runner losses across windows-2025 and windows-2022
  # (runs 36376821131, 36386857021, 36393024796, 36400228289, 36422741592,
  # 36434730160 — "The hosted runner lost communication with the server") at
  # four different phases of long single-runner jobs, while short windows jobs
  # complete. Each gate therefore runs on its OWN fresh runner so no single
  # Windows runner sustains the whole ~2-hour chromium workload.
  parity-windows-programs:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ./.github/actions/parity-setup
        with:
          artifact-suffix: windows-programs
      - name: Programs gate
        run: node parity/sweep-programs.mjs 2>&1 | tee parity/out/programs.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rendered-parity-windows-programs-${{ github.sha }}
          path: parity/out/
          if-no-files-found: error

  parity-windows-stateful:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ./.github/actions/parity-setup
        with:
          skip-unit-tests: 'true'
          artifact-suffix: windows-stateful
      - name: Stateful gate
        run: bash parity/sweep-stateful.sh 2>&1 | tee parity/out/stateful.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rendered-parity-windows-stateful-${{ github.sha }}
          path: parity/out/
          if-no-files-found: error

  parity-windows-corpus:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ./.github/actions/parity-setup
        with:
          skip-unit-tests: 'true'
          artifact-suffix: windows-corpus
      - name: Corpus gate
        run: npm run parity 2>&1 | tee parity/out/corpus.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rendered-parity-windows-corpus-${{ github.sha }}
          path: parity/out/
          if-no-files-found: error

  dispatch:
    needs: [parity, parity-windows-programs, parity-windows-stateful, parity-windows-corpus]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Mint scaffold-dispatch token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: 2959521
          private-key: ${{ secrets.EHSRE_APP_PRIVATE_KEY }}
          owner: noisefactorllc
          repositories: scaffold

      - name: Dispatch export-kit-release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run export-kit-release.yml \
            --repo noisefactorllc/scaffold \
            --ref main \
            -f kit=threejs \
            -f sha=${{ github.sha }}
