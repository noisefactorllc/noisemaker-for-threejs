name: Export kit

# Public repo: holds NO deploy credentials. Dispatches scaffold's
# export-kit-release.yml, which builds this repo's export kit at this exact
# SHA and ships it to kits.noisedeck.app. See scaffold
# docs/runbook/export-kits.md.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "export-kit/**"
      - ".github/workflows/export-kit.yml"
      # LICENSE is shipped kit content (vendored into LICENSES/): a relicense must auto-publish.
      - "LICENSE"
      - "src/**"
      - "package-lock.json"
      - "package.json"
      - "parity/**"
      - "test/**"
      - "vendor/fetch.sh"
      - ".github/actions/**"

concurrency:
  group: export-kit-${{ github.ref }}
  cancel-in-progress: false

env:
  NM_PARITY_PYTHON: python

jobs:
  # Linux + macOS run the full suite in one job: both are stable hosted
  # runners. macOS measures the byte-exact gates on real ANGLE/Metal.
  parity:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ./.github/actions/parity-setup
        with:
          artifact-suffix: ${{ matrix.os }}
      - name: Programs gate
        run: bash scripts/gate-step.sh parity/out/programs.log node parity/sweep-programs.mjs
      - name: Stateful gate
        if: ${{ !cancelled() }}
        run: bash parity/sweep-stateful.sh 2>&1 | tee parity/out/stateful.log
      - name: Corpus gate
        if: ${{ !cancelled() }}
        run: npm run parity 2>&1 | tee parity/out/corpus.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rendered-parity-${{ matrix.os }}-${{ github.sha }}
          path: parity/out/
          if-no-files-found: error

  # Windows: six hosted-runner losses across windows-2025 and windows-2022
  # (runs 36376821131, 36386857021, 36393024796, 36400228289, 36422741592,
  # 36434730160 — "The hosted runner lost communication with the server") at
  # four different phases of long single-runner jobs, while short windows jobs
  # complete. Each gate therefore runs on its OWN fresh runner so no single
  # Windows runner sustains the whole ~2-hour chromium workload.
  # Windows: six hosted-runner losses across windows-2025 and windows-2022
  # (runs 36376821131, 36386857021, 36393024796, 36400228289, 36422741592,
  # 36434730160 — "The hosted runner lost communication with the server") at
  # four different phases of long single-runner jobs, while short windows jobs
  # complete; run 36446557349 then killed the ~58-minute solo programs gate.
  # Each remaining long phase therefore runs on its own fresh runner, and the
  # programs gate is sharded (--shard i/N, round-robin over the sorted fixture
  # list — the six shards cover all 304 cases exactly once; each runner renders
  # ~51 cases in ~8 minutes, under the observed Windows runner survival window).
  parity-windows-programs-0of6:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ./.github/actions/parity-setup
        with:
          artifact-suffix: windows-programs-0of6
      - name: Programs gate shard 0/6
        run: bash scripts/gate-step.sh parity/out/programs.log node parity/sweep-programs.mjs --shard 0/6
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rendered-parity-windows-programs-0of6-${{ github.sha }}
          path: parity/out/
          if-no-files-found: error

  parity-windows-programs-1of6:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ./.github/actions/parity-setup
        with:
          skip-unit-tests: 'true'
          artifact-suffix: windows-programs-1of6
      - name: Programs gate shard 1/6
        run: bash scripts/gate-step.sh parity/out/programs.log node parity/sweep-programs.mjs --shard 1/6
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rendered-parity-windows-programs-1of6-${{ github.sha }}
          path: parity/out/
          if-no-files-found: error

  parity-windows-programs-2of6:
    if: github.ref == 'refs/heads/main'
