      - name: Programs gate shard 2/6
        run: bash scripts/gate-step.sh parity/out/programs.log node parity/sweep-programs.mjs --shard 2/6
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
