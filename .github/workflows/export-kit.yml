        with:
          skip-unit-tests: 'true'
          artifact-suffix: windows-corpus
      - name: Corpus gate
        run: bash scripts/gate-step.sh parity/out/corpus.log npm run parity
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rendered-parity-windows-corpus-${{ github.sha }}
          path: parity/out/
          if-no-files-found: error

  parity-windows-programs-verify:
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    permissions:
      contents: read
    needs: [parity-windows-programs-0of6, parity-windows-programs-1of6, parity-windows-programs-2of6, parity-windows-programs-3of6, parity-windows-programs-4of6, parity-windows-programs-5of12, parity-windows-programs-11of24, parity-windows-programs-23of48, parity-windows-programs-octaveWarp, parity-windows-programs-47of48-no-octaveWarp]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: rendered-parity-windows-programs-*-${{ github.sha }}
          path: shard-artifacts
      # current-programs (via scripts/verify-shards.mjs) reads the vendored
      # upstream effects manifest, which is produced by vendor/fetch.sh —
      # vendor/ is not committed (run 36611586678: verify-shards ENOENT).
      - name: Fetch vendor
        run: bash vendor/fetch.sh
      - name: Verify shard ledger coverage
        run: bash scripts/gate-step.sh shard-artifacts/verify.log bash -c 'ls shard-artifacts/; find shard-artifacts -maxdepth 2 -name "mode-ledger*" | sort; node scripts/verify-shards.mjs shard-artifacts/*/mode-ledger*.json'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rendered-parity-windows-programs-verify-${{ github.sha }}
          path: shard-artifacts/
          if-no-files-found: error

  parity-windows-consumer:
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    permissions:
      contents: read
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ./.github/actions/parity-setup
        with:
          skip-unit-tests: 'true'
          artifact-suffix: windows-consumer
      - name: Installed consumer gate
        run: |
          tarball=$(npm pack --pack-destination "$RUNNER_TEMP")
          consumer="$RUNNER_TEMP/threejs-consumer"
          mkdir -p "$consumer"
          npm install --prefix "$consumer" --no-audit --no-fund --bin-links=false "$RUNNER_TEMP/$tarball" three@0.186.1
          bash "$consumer/node_modules/noisemaker-for-threejs/vendor/fetch.sh"
          node parity/installed-consumer.mjs "$consumer" parity/out/installed-consumer 0.186.1
          npm uninstall --prefix "$consumer" --no-audit --no-fund --bin-links=false noisemaker-for-threejs
          test ! -d "$consumer/node_modules/noisemaker-for-threejs"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rendered-parity-windows-consumer-${{ github.sha }}
          path: parity/out/
          if-no-files-found: error

  dispatch:
    needs: [parity-windows-programs-verify, parity, parity-windows-programs-0of6, parity-windows-programs-1of6, parity-windows-programs-2of6, parity-windows-programs-3of6, parity-windows-programs-4of6, parity-windows-programs-5of12, parity-windows-programs-11of24, parity-windows-programs-23of48, parity-windows-programs-octaveWarp, parity-windows-programs-47of48-no-octaveWarp, parity-windows-stateful, parity-windows-corpus, parity-windows-consumer]
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Mint scaffold-dispatch token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: 2959521
          private-key: ${{ secrets.EHSRE_APP_PRIVATE_KEY }}
          owner: noisefactorllc
          repositories: scaffold

      - name: Dispatch export-kit-release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run export-kit-release.yml \
            --repo noisefactorllc/scaffold \
            --ref main \
            -f kit=threejs \
            -f sha=${{ github.sha }}

  parity-windows-served-kit:
    needs: dispatch
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    permissions:
      contents: read
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ./.github/actions/parity-setup
        with:
          skip-unit-tests: 'true'
          artifact-suffix: windows-served-kit
      - name: Wait for exact-source served kit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node --input-type=module - <<'JS'
          const url = 'https://kits.noisedeck.app/threejs/0/kit.json'
          const deadline = Date.now() + 30 * 60 * 1000
          while (Date.now() < deadline) {
            try {
              const response = await fetch(url, { cache: 'no-store' })
              if (response.ok) {
                const kit = await response.json()
                if (kit.source?.sha === process.env.EXPECTED_SHA) process.exit(0)
              }
            } catch { /* The release may still be in progress. */ }
            await new Promise(resolve => setTimeout(resolve, 30000))
          }
          throw new Error('Exact-source served kit did not appear within 30 minutes')
          JS
      - name: Served kit consumer gate
        run: node parity/kit-consumer.mjs parity/out/kit-consumer
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rendered-parity-windows-served-kit-${{ github.sha }}
          path: parity/out/
          if-no-files-found: error
