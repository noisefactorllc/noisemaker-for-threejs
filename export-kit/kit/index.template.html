<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>{{NM_PROGRAM_NAME_HTML}} · Noisedeck</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #0a0a0c;
    color: #e7e7ea;
    font: 400 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 14px 18px 10px;
  }
  #program-name {
    margin: 0;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.01em;
    color: #f2f2f5;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #status {
    flex: none;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #6f6f7b;
    white-space: nowrap;
    transition: opacity 400ms ease;
  }
  #status.is-done { opacity: 0; }
  #status.is-failed { color: #ff8fa8; opacity: 1; }

  #stage {
    position: relative;
    display: flex;
    min-height: 0;
    padding: 0 18px;
  }
  /* `NoisemakerCanvas` has no live resize, so the backing store keeps the size
     it was measured at while the CSS box follows the window. `contain` is what
     makes that stretch a letterbox instead of a distortion — the render keeps
     its aspect ratio until a reload measures the window again. */
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 3px;
    background: #050506;
    box-shadow: 0 0 0 1px #1c1c22, 0 24px 60px -30px #000;
  }

  footer {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding: 10px 18px 14px;
    font-size: 11px;
    color: #55555f;
  }
  footer a { color: inherit; text-decoration: none; border-bottom: 1px solid #2a2a33; }
  footer a:hover { color: #9a9aa6; }

  #err {
    position: absolute;
    left: 18px;
    right: 18px;
    bottom: 0;
    padding: 14px 16px;
    border: 1px solid #4a2230;
    border-left-width: 3px;
    border-radius: 3px;
    background-color: #171014;
    color: #f0c9d2;
    font: 400 12px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap;
    overflow: auto;
    max-height: 70%;
  }
  #err[hidden] { display: none; }
  #err strong { display: block; margin-bottom: 6px; color: #ff8fa8; font-weight: 500; }

  @media (max-width: 600px) {
    header, footer { padding-left: 12px; padding-right: 12px; }
    #stage { padding: 0 12px; }
    #err { left: 12px; right: 12px; }
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "./hostlib/three/three.module.min.js",
    "./adapter/vendor/noisemaker/noisemaker-shaders-core.esm.js": "./adapter/vendor/noisemaker/noisemaker-shaders-core.esm.min.js"
  }
}
</script>
</head>
<body>

<header>
  <h1 id="program-name">{{NM_PROGRAM_NAME_HTML}}</h1>
  <span id="status">loading engine</span>
</header>

<main id="stage">
  <canvas id="nm-canvas"></canvas>
  <div id="err" role="alert" hidden></div>
</main>

<footer>
  <span>noisemaker {{NM_ENGINE_VERSION}} · three.js 0.171.0</span>
  <span>made with Noisedeck</span>
</footer>

<script type="module">
  // The adapter's public surface. `engine-browser.js` imports the engine by a
  // relative path of its own (../vendor/noisemaker/…esm.js); the import map
  // above points that specifier at the minified filename that actually ships.
  // Both sides are relative — nothing here reaches the network.
  import { NoisemakerCanvas } from './adapter/src/index.js'
  import { core, extractEffectNamesFromDsl } from './adapter/src/engine-browser.js'
  import { bootCore, registerEffectInstance, finalizeEnums } from './adapter/src/effects/register-effect.js'

  // ---- exported program -------------------------------------------------
  const PROGRAM_NAME = {{NM_PROGRAM_NAME_JSON}};
  const DSL = {{NM_DSL_JSON}};
  // Where the effect mini-bundles and their manifest live: the packaged
  // engine beside adapter/src/ when the engine shipped, the pinned CDN when it
  // did not. One value drives both, so the page can never load a manifest from
  // one build and effects from another.
  const BUNDLE_PATH = './adapter/vendor/noisemaker/effects';
  const LOOP_SECONDS = 15;

  const canvas = document.getElementById('nm-canvas');
  const statusEl = document.getElementById('status');
  const errEl = document.getElementById('err');
  const nameEl = document.getElementById('program-name');

  nameEl.textContent = PROGRAM_NAME;

  function setStatus(text, state) {
    statusEl.className = state || '';
    if (text !== null) statusEl.textContent = text;
  }

  function showError(e) {
    setStatus('failed', 'is-failed');
    errEl.hidden = false;
    errEl.textContent = '';
    const title = document.createElement('strong');
    title.textContent = 'This program could not start.';
    errEl.appendChild(title);
    errEl.appendChild(document.createTextNode(String((e && e.stack) || e)));
    console.error('Noisedeck export failed:', e);
  }

  function measure() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    return {
      width: Math.max(64, Math.round(rect.width * dpr)),
      height: Math.max(64, Math.round(rect.height * dpr)),
    };
  }

  // Register exactly the effects this program uses, from BUNDLE_PATH.
  //
  // Registration is driven from BUNDLE_PATH, using the adapter's own shared
  // helper so it cannot drift from the loader the adapter uses internally.
  async function registerEffects() {
    const manifestUrl = `${BUNDLE_PATH}/manifest.json`;
    const response = await fetch(manifestUrl);
    if (!response.ok) {
      throw new Error(`effect manifest ${manifestUrl}: HTTP ${response.status}`);
    }
    const manifest = await response.json();
    const effectIds = extractEffectNamesFromDsl(DSL, manifest).map((e) => e.effectId);

    await bootCore(core);
    const choices = {};
    for (const effectId of effectIds) {
      const [namespace, name] = effectId.split('/');
      const module = await import(`${BUNDLE_PATH}/${namespace}/${name}.js`);
      await registerEffectInstance(core, namespace, name, module.default, choices);
    }
    await finalizeEnums(core, choices);
    return effectIds;
  }

  async function boot() {
    setStatus('loading engine');
    const size = measure();
    canvas.width = size.width;
    canvas.height = size.height;

    setStatus('loading effects');
    await registerEffects();

    setStatus('compiling');
    const nm = new NoisemakerCanvas(canvas, { width: size.width, height: size.height });
    await nm.compile(DSL);
    setStatus('running', 'is-done');

    const started = performance.now();
    function frame() {
      nm.renderFrame(((performance.now() - started) / (LOOP_SECONDS * 1000)) % 1);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  try {
    await boot();
  } catch (e) {
    showError(e);
  }
</script>

</body>
</html>
