<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>noisemaker-three candidate</title>
    <script type="importmap">
      { "imports": { "three": "/node_modules/three/build/three.module.js" } }
    </script>
  </head>
  <body>
    <canvas id="c" width="256" height="256"></canvas>
    <script type="module">
      import { NoisemakerCanvas } from '/src/index.js'

      // Render a DSL program deterministically and return linear-float pixels
      // (bottom-up, as gl.readPixels yields). The Node harness quantizes + flips
      // + encodes identically to the golden renderer.
      window.__nm_render = async (dsl, size, time, frames) => {
        const canvas = document.getElementById('c')
        canvas.width = size
        canvas.height = size
        const nm = new NoisemakerCanvas(canvas, { width: size, height: size })
        await nm.compile(dsl)
        nm.renderFrames(time, frames)
        const { width, height, data } = nm.readPixels()
        return { width, height, data: Array.from(data) }
      }
      window.__nm_ready = true
    </script>
  </body>
</html>
