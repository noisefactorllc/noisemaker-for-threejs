<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>noisemaker-three candidate</title>
    <script type="importmap">
      { "imports": { "three": "/node_modules/three/build/three.module.js" } }
    </script>
  </head>
  <body>
    <canvas id="c" width="256" height="256"></canvas>
    <script type="module">
      import { NoisemakerCanvas, NoisemakerTexture, NoisemakerPass } from '/src/index.js'
      import * as THREE from 'three'
      import { EffectComposer } from '/node_modules/three/examples/jsm/postprocessing/EffectComposer.js'
      import { RenderPass } from '/node_modules/three/examples/jsm/postprocessing/RenderPass.js'

      // Render a DSL program deterministically and return linear-float pixels
      // (bottom-up, as gl.readPixels yields). The Node harness quantizes + flips
      // + encodes identically to the golden renderer.
      window.__nm_render = async (dsl, size, time, frames) => {
        const canvas = document.getElementById('c')
        canvas.width = size
        canvas.height = size
        const nm = new NoisemakerCanvas(canvas, { width: size, height: size })
        await nm.compile(dsl)
        nm.renderFrames(time, frames)
        const { width, height, data } = nm.readPixels()
        return { width, height, data: Array.from(data) }
      }

      // Render via NoisemakerTexture (offscreen) sharing a renderer — verifies the
      // texture integration path produces the same pixels as the canvas path.
      window.__nm_render_texture = async (dsl, size, time, frames) => {
        const canvas = document.getElementById('c')
        canvas.width = size
        canvas.height = size
        const renderer = new THREE.WebGLRenderer({ canvas, preserveDrawingBuffer: true, alpha: true })
        renderer.setPixelRatio(1)
        renderer.setSize(size, size, false)
        const nmTex = new NoisemakerTexture(renderer, { width: size, height: size })
        await nmTex.compile(dsl)
        for (let i = 0; i < frames; i++) nmTex.update(time)
        const { width, height, data } = nmTex.readPixels()
        return { width, height, data: Array.from(data) }
      }
      // Read a render target as linear float (bottom-up), matching the other paths.
      function readRT(renderer, rt, size) {
        const gl = renderer.getContext()
        const data = new Float32Array(size * size * 4)
        renderer.setRenderTarget(rt)
        gl.readPixels(0, 0, size, size, gl.RGBA, gl.FLOAT, data)
        renderer.setRenderTarget(null)
        return data
      }

      // Validate NoisemakerPass two ways:
      //  - generative: a self-contained program through EffectComposer must equal the
      //    NoisemakerCanvas of the same program (bit-exact) — proves render+blit plumbing.
      //  - filter: a known solid-color scene fed through `media().write(o0)` must come
      //    back as that color — proves the scene→external-source binding.
      window.__nm_render_pass = async (dsl, size, time, frames) => {
        const canvas = document.getElementById('c')
        canvas.width = size
        canvas.height = size
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, preserveDrawingBuffer: true })
        renderer.setPixelRatio(1)
        renderer.setSize(size, size, false)
        renderer.autoClear = false

        // --- generative parity: pass output vs canvas output ---
        const rtOpts = { type: THREE.FloatType, format: THREE.RGBAFormat, depthBuffer: false, stencilBuffer: false }
        const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(size, size, rtOpts))
        composer.renderToScreen = false

        // Scene pass renders a known solid color (the "incoming scene").
        const SCENE = [0.2, 0.6, 0.9]
        const scene = new THREE.Scene()
        const cam = new THREE.Camera()
        const quad = new THREE.Mesh(
          new THREE.PlaneGeometry(2, 2),
          new THREE.RawShaderMaterial({
            glslVersion: THREE.GLSL3,
            vertexShader: 'in vec3 position;\nvoid main(){ gl_Position = vec4(position, 1.0); }',
            fragmentShader:
              'precision highp float;\nout vec4 c;\nuniform vec3 col;\nvoid main(){ c = vec4(col, 1.0); }',
            uniforms: { col: { value: new THREE.Vector3(SCENE[0], SCENE[1], SCENE[2]) } },
            depthTest: false,
            depthWrite: false,
          })
        )
        quad.frustumCulled = false
        scene.add(quad)
        composer.addPass(new RenderPass(scene, cam))

        const pass = new NoisemakerPass(renderer, { width: size, height: size, time })
        await pass.compile(dsl)
        composer.addPass(pass)
        for (let i = 0; i < frames; i++) composer.render(0)
        const passData = readRT(renderer, composer.readBuffer, size)

        // Canvas reference for the same program/time.
        const refCanvas = document.createElement('canvas')
        refCanvas.width = size
        refCanvas.height = size
        const nm = new NoisemakerCanvas(refCanvas, { width: size, height: size })
        await nm.compile(dsl)
        nm.renderFrames(time, frames)
        const refData = nm.readPixels().data

        let maxDiff = 0
        for (let i = 0; i < passData.length; i++) {
          maxDiff = Math.max(maxDiff, Math.abs(passData[i] * 255 - refData[i] * 255))
        }

        // --- filter binding: solid scene -> media() -> should be the scene color ---
        const fcomposer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(size, size, rtOpts))
        fcomposer.renderToScreen = false
        fcomposer.addPass(new RenderPass(scene, cam))
        const fpass = new NoisemakerPass(renderer, { width: size, height: size, time })
        await fpass.compile('search synth\nmedia().write(o0)\nrender(o0)')
        fcomposer.addPass(fpass)
        for (let i = 0; i < frames; i++) fcomposer.render(0)
        const fData = readRT(renderer, fcomposer.readBuffer, size)
        const ci = (Math.floor(size / 2) * size + Math.floor(size / 2)) * 4
        const center = [fData[ci], fData[ci + 1], fData[ci + 2]]
        const boundOK = fpass.sourceIds.length > 0 &&
          Math.abs(center[0] - SCENE[0]) < 0.02 &&
          Math.abs(center[1] - SCENE[1]) < 0.02 &&
          Math.abs(center[2] - SCENE[2]) < 0.02

        return {
          width: size,
          height: size,
          maxDiff,
          sourceIds: pass.sourceIds,
          filterSourceIds: fpass.sourceIds,
          center,
          scene: SCENE,
          boundOK,
        }
      }
      window.__nm_ready = true
    </script>
  </body>
</html>
