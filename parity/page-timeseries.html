<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>noisemaker-three time-series parity</title>
    <script type="importmap">
      { "imports": { "three": "/node_modules/three/build/three.module.js" } }
    </script>
  </head>
  <body>
    <canvas id="c" width="256" height="256"></canvas>
    <script type="module">
      import * as THREE from 'three'
      // Engine from the CDN bundle (vendor/fetch.sh). Golden = core's createPipeline (WebGL2Backend),
      // candidate = core's Pipeline + ThreeBackend (via createThreePipeline). Same engine both sides.
      import { compileGraph, createPipeline, loadEffectsForDsl } from '/src/engine-browser.js'
      import { createThreePipeline } from '/src/runtime/create-three-pipeline.js'

      THREE.ColorManagement.enabled = false

      // Deterministic mesh for mesh-effect parity (no live OBJ-URL fetch, no parser dependency):
      // a precomputed CCW-outward unit cube (36 verts = 12 tris) with outward face normals. The
      // parity test validates the adapter's uploadMeshData + triangle raster, not the engine's
      // OBJ parser, so injecting vertex data directly is equivalent and self-contained.
      const CUBE = (() => {
        const c = [[-0.5,-0.5,0.5],[0.5,-0.5,0.5],[0.5,0.5,0.5],[-0.5,0.5,0.5],[-0.5,-0.5,-0.5],[0.5,-0.5,-0.5],[0.5,0.5,-0.5],[-0.5,0.5,-0.5]]
        const faces = [ // a,b,c,d (quad -> tris abc, acd) + outward normal
          [0,1,2,3, 0,0,1], [1,5,6,2, 1,0,0], [5,4,7,6, 0,0,-1],
          [4,0,3,7, -1,0,0], [3,2,6,7, 0,1,0], [4,5,1,0, 0,-1,0],
        ]
        const positions = [], normals = []
        const push = (vi, n) => { positions.push(c[vi][0], c[vi][1], c[vi][2]); normals.push(n[0], n[1], n[2]) }
        for (const f of faces) {
          const n = [f[4], f[5], f[6]]
          push(f[0], n); push(f[1], n); push(f[2], n)
          push(f[0], n); push(f[2], n); push(f[3], n)
        }
        return { positions, normals, vertexCount: positions.length / 3 }
      })()
      const MESH_SHAPES = { cube: CUBE }

      // Read the golden (the CDN engine's own WebGL2Backend) render surface as linear float
      // (FBO on the surface texture, RGBA/FLOAT) — same readback the candidate uses.
      function readGolden(pipeline, size) {
        const backend = pipeline.backend
        const gl = backend.gl
        const surfName = pipeline.graph?.renderSurface || 'o0'
        const surf = pipeline.surfaces?.get(surfName)
        const info = backend.textures?.get(pipeline.frameReadTextures?.get(surfName) ?? surf.read)
        const fbo = gl.createFramebuffer()
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo)
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, info.handle, 0)
        const buf = new Float32Array(size * size * 4)
        gl.readPixels(0, 0, size, size, gl.RGBA, gl.FLOAT, buf)
        gl.bindFramebuffer(gl.FRAMEBUFFER, null)
        gl.deleteFramebuffer(fbo)
        return buf
      }

      // Apply a DETERMINISTIC external input to the pipeline, identically for golden
      // (vendored WebGL2) and candidate (ThreeBackend), so the long-tail external-input
      // effects (scope/spectrum/media/mesh) can be parity-tested without a live —
      // therefore nondeterministic — feed. The spec is plain data so both modes build
      // byte-identical inputs.
      async function applyInject(pipeline, inject, size) {
        if (inject.audio) {
          const N = 128
          const waveform = new Float32Array(N)
          const spectrum = new Float32Array(N)
          const cycles = inject.audio.cycles ?? 3
          const bands = inject.audio.bands ?? 6
          for (let i = 0; i < N; i++) {
            const x = i / N
            waveform[i] = 0.5 + 0.45 * Math.sin(x * Math.PI * 2 * cycles)
            spectrum[i] = Math.max(0, 1 - x) * (0.5 + 0.5 * Math.cos(x * Math.PI * 2 * bands))
          }
          pipeline.setAudioState({ waveform, spectrum, low: 0, mid: 0, high: 0, vol: 0, fft: new Float32Array(16) })
        }
        if (inject.image) {
          // Deterministic, opaque, full-frame pattern (gradients + geometric shapes only —
          // no text, to avoid any font nondeterminism). Both modes run in the same Chromium,
          // so the Canvas2D bytes are identical. media's imageSize default (1024) samples the
          // centered region, so a 1024² source fills the frame.
          const S = inject.image.size ?? 1024
          const cv = document.createElement('canvas')
          cv.width = cv.height = S
          const x = cv.getContext('2d')
          const grad = x.createLinearGradient(0, 0, S, S)
          grad.addColorStop(0, '#102038'); grad.addColorStop(1, '#e08040')
          x.fillStyle = grad; x.fillRect(0, 0, S, S)
          x.fillStyle = '#ff3050'; x.fillRect(S * 0.12, S * 0.12, S * 0.34, S * 0.34)
          x.fillStyle = '#30c0ff'; x.beginPath(); x.arc(S * 0.68, S * 0.4, S * 0.18, 0, Math.PI * 2); x.fill()
          x.fillStyle = '#ffe020'; x.fillRect(S * 0.28, S * 0.62, S * 0.5, S * 0.16)
          x.fillStyle = '#20ff80'; x.beginPath(); x.moveTo(S * 0.2, S * 0.9); x.lineTo(S * 0.5, S * 0.55); x.lineTo(S * 0.8, S * 0.9); x.closePath(); x.fill()
          const ids = new Set()
          for (const pass of pipeline.graph?.passes || [])
            for (const v of Object.values(pass.inputs || {}))
              if (typeof v === 'string' && /_step_\d+$/.test(v)) ids.add(v)
          for (const id of ids) pipeline.backend.updateTextureFromSource(id, cv, { flipY: true })
        }
        if (inject.mesh) {
          // Pack the precomputed mesh vertices into a square RGBA texture grid (xyz+valid /
          // normal / uv) and upload to mesh0 surfaces on BOTH backends. Identical bytes ->
          // identical raster. count drawn = w*h (padding verts are zero -> degenerate, no frags).
          const { positions, normals, vertexCount } = MESH_SHAPES[inject.mesh.shape || 'cube']
          const w = Math.max(1, Math.ceil(Math.sqrt(vertexCount)))
          const h = Math.max(1, Math.ceil(vertexCount / w))
          const N = w * h
          const pos = new Float32Array(N * 4)
          const nrm = new Float32Array(N * 4)
          const uv = new Float32Array(N * 4)
          for (let i = 0; i < vertexCount; i++) {
            pos[i * 4] = positions[i * 3]; pos[i * 4 + 1] = positions[i * 3 + 1]; pos[i * 4 + 2] = positions[i * 3 + 2]; pos[i * 4 + 3] = 1
            nrm[i * 4] = normals[i * 3]; nrm[i * 4 + 1] = normals[i * 3 + 1]; nrm[i * 4 + 2] = normals[i * 3 + 2]
          }
          pipeline.backend.uploadMeshData('mesh0', pos, nrm, uv, w, h, vertexCount)
        }
      }

      window.__nm_timeseries = async ({ dsl, mode, size, frames, captureEvery, loopFrames, inject }) => {
        const canvas = document.getElementById('c')
        canvas.width = size
        canvas.height = size
        await loadEffectsForDsl(dsl)
        const graph = compileGraph(dsl)

        let pipeline
        let readback
        if (mode === 'candidate') {
          const renderer = new THREE.WebGLRenderer({ canvas, preserveDrawingBuffer: true, alpha: true })
          renderer.setPixelRatio(1)
          renderer.setSize(size, size, false)
          pipeline = await createThreePipeline(graph, { renderer, width: size, height: size, presentToScreen: false })
          readback = () => pipeline.backend.readPixels().data
        } else {
          // GOLDEN: the vendored reference WebGL2 backend, driven identically.
          pipeline = await createPipeline(graph, { canvas, width: size, height: size, preferWebGPU: false })
          readback = () => readGolden(pipeline, size)
        }

        if (inject) await applyInject(pipeline, inject, size)
        // Mesh data lands via a direct backend upload (uploadMeshData), outside the normal
        // pass-graph write path. The very first pipeline.render() after that upload is where
        // meshRender's "count: input" vertex count first gets threaded through the compiled
        // graph's own per-frame state -- both backends need that one render to settle before
        // the injected mesh is what a captured frame actually shows. This mirrors the
        // reference engine's OWN test convention of always rendering twice before asserting
        // anything (e.g. its test_artistic_effect_release.mjs / test_corrective_mode_variants.mjs
        // call `renderer.render(t); renderer.render(t)` unconditionally) -- frame index 1 with
        // zero prior renders is never a moment the engine's own authors consider meaningful to
        // sample. Scoped to mesh specifically: audio/image injection (setAudioState /
        // updateTextureFromSource) has no such settle frame and is already bit-exact at frame 1.
        if (inject?.mesh) pipeline.render(0)

        const captures = []
        for (let i = 0; i < frames; i++) {
          const t = (i % loopFrames) / loopFrames
          pipeline.render(t)
          if ((i + 1) % captureEvery === 0) {
            captures.push({ frame: i + 1, data: Array.from(readback()) })
          }
        }
        return captures
      }
      window.__nm_ts_ready = true
    </script>
  </body>
</html>
